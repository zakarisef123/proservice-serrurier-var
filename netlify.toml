# Le site est pré-généré dans /public par `python3 src/build.py` (fichiers commités).
[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Ancienne prestation « reproduction de clés » remplacée par « clé cassée dans la serrure ».
[[redirects]]
  from = "/reproduction-cles-var/"
  to = "/cle-cassee-serrure-var/"
  status = 301
